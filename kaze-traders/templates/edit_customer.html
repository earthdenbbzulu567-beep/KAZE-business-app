{% extends "base.html" %}
{% block content %}
<h1>Edit Customer</h1>
<form method="POST">
    <div class="form-group">
        <input type="text" name="name" value="{{ customer.name }}" placeholder="Customer name" required>
    </div>
    <div class="form-group">
        <input type="email" name="email" value="{{ customer.email or '' }}" placeholder="Email">
    </div>
    <div class="form-group">
        <input type="text" name="phone" value="{{ customer.phone or '' }}" placeholder="Phone">
    </div>
    <div class="form-group">
        <input type="text" name="address" value="{{ customer.address or '' }}" placeholder="Address">
    </div>
    <div class="form-group" style="display:block; width:100%;">
        <textarea name="notes" rows="3" style="width:100%; max-width:600px;">{{ customer.notes or '' }}</textarea>
    </div>
    <button type="submit">Save Changes</button>
    <a href="{{ url_for('customers') }}">Cancel</a>
</form>
{% endblock %}
