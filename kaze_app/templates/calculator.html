{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Profit calculator</h1>
        <p>Estimate profit before you record a sale. Pick a product or type your own numbers.</p>
    </div>
</div>
<div class="widget">
    <div class="form-group">
        <label>Product (optional)</label>
        <select id="prodSelect">
            <option value="">Custom numbers</option>
            {% for p in products %}
            <option value="{{ p.cost_price }}|{{ p.selling_price }}">{{ p.product_name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group"><label>Cost each</label><input type="number" step="0.01" id="cost" value="0"></div>
    <div class="form-group"><label>Sell each</label><input type="number" step="0.01" id="sell" value="0"></div>
    <div class="form-group"><label>Quantity</label><input type="number" step="any" id="qty" value="1"></div>
</div>
<div class="stat-grid">
    <div class="stat-chip"><span>Revenue</span><strong id="rev">$0.00</strong></div>
    <div class="stat-chip"><span>Cost</span><strong id="totCost">$0.00</strong></div>
    <div class="stat-chip"><span>Profit</span><strong id="profit">$0.00</strong></div>
    <div class="stat-chip"><span>Margin</span><strong id="margin">0%</strong></div>
</div>
<script>
function money(n){ return (n<0?'-$':'$') + Math.abs(n).toFixed(2); }
function calc(){
    const cost = parseFloat(document.getElementById('cost').value)||0;
    const sell = parseFloat(document.getElementById('sell').value)||0;
    const qty = parseFloat(document.getElementById('qty').value)||0;
    const rev = sell*qty, tot = cost*qty, profit = rev-tot;
    const margin = rev ? (profit/rev*100) : 0;
    document.getElementById('rev').textContent = money(rev);
    document.getElementById('totCost').textContent = money(tot);
    document.getElementById('profit').textContent = money(profit);
    document.getElementById('margin').textContent = margin.toFixed(1) + '%';
}
document.getElementById('prodSelect').addEventListener('change', e => {
    if(!e.target.value) return;
    const [c,s] = e.target.value.split('|');
    document.getElementById('cost').value = c;
    document.getElementById('sell').value = s;
    calc();
});
['cost','sell','qty'].forEach(id => document.getElementById(id).addEventListener('input', calc));
calc();
</script>
{% endblock %}
