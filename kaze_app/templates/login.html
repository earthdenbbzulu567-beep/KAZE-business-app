{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <h1>Welcome back</h1>
    <p style="margin-top:-0.6rem; margin-bottom:1.2rem;">Log in to KAZE and pick up where you left off.</p>
    <form method="POST">
        <div class="form-group">
            <label>Email or username</label>
            <input type="text" name="login_input" placeholder="Email or Username" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" maxlength="80" placeholder="Password" required>
        </div>
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="{{ url_for('signup') }}">Sign up here</a></p>
</div>
{% endblock %}
