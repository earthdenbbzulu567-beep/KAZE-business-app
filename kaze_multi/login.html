{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <p class="home-kicker" style="text-align:center;">KAZE Traders</p>
    <h1>Welcome back</h1>
    <p style="margin-top:-0.55rem; margin-bottom:1.25rem; text-align:center; color:var(--text2);">Log in and pick up the trading day.</p>
    <form method="POST">
        <div class="form-group">
            <label>Email or username</label>
            <input type="text" name="login_input" placeholder="Email or username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" maxlength="80" placeholder="Password" required autocomplete="current-password">
        </div>
        <button type="submit">Log in</button>
    </form>
    <p style="text-align:center;margin-top:1rem;">No account yet? <a href="{{ url_for('signup') }}">Create one</a></p>
</div>
{% endblock %}
