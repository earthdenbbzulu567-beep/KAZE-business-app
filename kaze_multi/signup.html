{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <p class="home-kicker" style="text-align:center;">KAZE Traders</p>
    <h1>Create your account</h1>
    <p style="margin-top:-0.55rem; margin-bottom:1.25rem; text-align:center; color:var(--text2);">Set up the shop in a couple of minutes.</p>
    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" maxlength="40" minlength="2" placeholder="Username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Email" required autocomplete="email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" minlength="6" maxlength="80" placeholder="At least 6 characters" required autocomplete="new-password">
        </div>
        <button type="submit">Create account</button>
    </form>
    <p style="text-align:center;margin-top:1rem;">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
