{% extends "base.html" %}
{% block content %}
<h1>Edit Stock Item</h1>
<form method="POST">
    <input type="text" name="product_name" value="{{ item.product_name }}" required>
    <input type="number" step="any" name="quantity" value="{{ item.quantity }}" required>
    <input type="number" step="any" name="cost_price" value="{{ item.cost_price }}" required>
    <input type="number" step="any" name="selling_price" value="{{ item.selling_price }}" required>
    <input type="text" name="unit" value="{{ item.unit }}">
    <button type="submit">Save Changes</button>
    <a href="{{ url_for('stock') }}">Cancel</a>
</form>
{% endblock %}
