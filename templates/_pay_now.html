{% set ready = pay_methods|selectattr('ready')|list if pay_methods is defined else [] %}
<div class="pay-now-row">
{% if ready %}
    {% for m in ready %}
    <a class="{% if loop.first %}pay-now{% else %}btn-secondary{% endif %}" href="{{ url_for('kaze_checkout', kind=pay_kind, id=pay_id or 0, tier=pay_tier or '', method=m.key) }}">Pay now{% if not loop.first %} · {{ m.label }}{% endif %}</a>
    {% endfor %}
{% else %}
    <a class="btn-secondary" href="{{ url_for('settings') }}">Set up Pay now</a>
{% endif %}
</div>
