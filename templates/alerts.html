{% extends "base.html" %}
{% block title %}Smart Alerts{% endblock %}
{% block content %}
<div class="page-header"><h1><i data-lucide="bell-ring"></i> Smart Alerts Center</h1></div>
<div class="card">
  {% for a in alerts %}
  <div class="alert alert-{{ a.type }}">{{ a.msg }}</div>
  {% else %}
  <p>All clear — no urgent alerts.</p>
  {% endfor %}
</div>
{% endblock %}
