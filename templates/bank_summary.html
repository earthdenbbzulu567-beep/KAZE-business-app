{% extends "base.html" %}
{% block title %}Bank Summary{% endblock %}
{% block content %}
<div class="page-header"><h1><i data-lucide="landmark"></i> Bank Accounts</h1></div>
<div class="table-wrapper">
<table>
<thead><tr><th>Name</th><th>Account</th><th>Balance</th></tr></thead>
<tbody>
{% for a in accounts %}
<tr><td>{{ a.name }}</td><td>{{ a.account_number or '—' }}</td><td>{{ money(a.balance) }}</td></tr>
{% else %}
<tr><td colspan="3">No bank accounts.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
