{% extends "base.html" %}
{% block title %}Day Closes{% endblock %}
{% block content %}
<div class="page-header"><h1><i data-lucide="calendar-check"></i> Day Closes</h1></div>
<div class="table-wrapper">
<table>
<thead><tr><th>Date</th><th>Sales</th><th>Expenses</th><th>Net</th></tr></thead>
<tbody>
{% for c in closes %}
<tr><td>{{ c.close_date }}</td><td>{{ money(c.total_sales) }}</td><td>{{ money(c.total_expenses) }}</td><td>{{ money(c.net) }}</td></tr>
{% else %}
<tr><td colspan="4">No day closes yet.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
