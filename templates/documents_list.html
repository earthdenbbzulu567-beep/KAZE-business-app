{% extends "base.html" %}
{% block title %}Documents{% endblock %}
{% block content %}
<div class="page-header"><h1><i data-lucide="folder"></i> Documents</h1></div>
<div class="table-wrapper">
<table>
<thead><tr><th>Title</th><th>Type</th><th>Created</th></tr></thead>
<tbody>
{% for d in docs %}
<tr><td>{{ d.title }}</td><td>{{ d.doc_type }}</td><td>{{ d.created_at }}</td></tr>
{% else %}
<tr><td colspan="3">No documents.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
