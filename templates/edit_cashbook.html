{% extends "base.html" %}
{% block content %}
<h1>Edit Cash Entry</h1>
<form method="POST">
    <select name="entry_type">
        <option value="in" {% if entry.entry_type == 'in' %}selected{% endif %}>Cash In</option>
        <option value="out" {% if entry.entry_type == 'out' %}selected{% endif %}>Cash Out</option>
    </select>
    <input type="text" name="category" value="{{ entry.category }}" required>
    <input type="text" name="description" value="{{ entry.description }}">
    <input type="number" step="any" name="amount" value="{{ entry.amount }}" required>
    <input type="date" name="date" value="{{ entry.date }}" required>
    <button type="submit">Save</button>
    <a href="{{ url_for('cashbook') }}">Cancel</a>
</form>
{% endblock %}
