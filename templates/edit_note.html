{% extends "base.html" %}
{% block content %}
<div class="page-header"><div><h1>Edit note</h1></div></div>
<form method="POST">
    <div class="form-group" style="display:block;width:100%;"><label>Title</label>
        <input type="text" name="title" value="{{ note.title }}" style="width:100%;max-width:480px;">
    </div>
    <div class="form-group" style="display:block;width:100%;"><label>Body</label>
        <textarea name="body" rows="8" style="width:100%;max-width:700px;">{{ note.body }}</textarea>
    </div>
    <button type="submit">Save changes</button>
    <a href="{{ url_for('notes') }}">Cancel</a>
</form>
{% endblock %}
