<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ code }} · KAZE</title>
    <style>
        :root {
            --bg: #f9fafb;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --text-muted: #6b7280;
            --text-light: #9ca3af;
            --brand: #1a8f3c;
            --brand-hover: #157432;
            --danger: #dc2626;
            --warn: #d97706;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #1e293b;
                --border: #334155;
                --text: #f8fafc;
                --text-muted: #94a3b8;
                --text-light: #64748b;
                --brand: #22c55e;
                --brand-hover: #16a34a;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
        }
        .wrap {
            max-width: 26rem;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand-mark {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--brand), var(--brand-hover));
            display: grid;
            place-items: center;
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 12px 28px rgba(26, 143, 60, 0.3);
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
        }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .code {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            margin: 0 0 0.5rem;
            color: {% if code and code >= 500 %}var(--danger){% elif code and code >= 400 %}var(--warn){% else %}var(--brand){% endif %};
            animation: pulseSoft 2.4s ease-in-out infinite;
        }
        @keyframes pulseSoft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.75; }
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 0.6rem;
            animation: fadeInUp 0.5s ease 0.2s both;
        }
        .message {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0 0 2rem;
            animation: fadeInUp 0.5s ease 0.3s both;
        }
        .actions {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 0.5s ease 0.4s both;
        }
        .actions a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.7rem 1.3rem;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.15s ease;
        }
        .actions a.primary {
            background: var(--brand);
            color: #ffffff;
        }
        .actions a.primary:hover {
            background: var(--brand-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(26, 143, 60, 0.3);
        }
        .actions a.secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .actions a.secondary:hover {
            border-color: var(--brand);
            color: var(--brand);
        }
        .footnote {
            color: var(--text-light);
            font-size: 0.75rem;
            margin-top: 2.5rem;
            animation: fadeInUp 0.5s ease 0.5s both;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand-mark">K</div>
        <div class="code">{{ code }}</div>
        <h1>{{ title }}</h1>
        <p class="message">{{ message }}</p>
        <div class="actions">
            <a href="/" class="primary">← Home</a>
            <a href="/dashboard" class="secondary">Dashboard</a>
        </div>
        <p class="footnote">KAZE Traders Business Manager</p>
    </div>
</body>
</html>
