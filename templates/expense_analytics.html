{% extends "base.html" %}
{% block title %}Expense Analytics{% endblock %}
{% block content %}
<div class="page-header"><h1><i data-lucide="bar-chart"></i> Expense Analytics</h1></div>
<div class="card">
  <table class="data-table">
    <thead><tr><th>Category</th><th>Total</th></tr></thead>
    <tbody>
      {% for c in categories %}
      <tr><td>{{ c.category or 'Uncategorized' }}</td><td>{{ money(c.total) }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
