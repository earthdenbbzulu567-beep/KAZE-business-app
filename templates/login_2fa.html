{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <p class="home-kicker" style="text-align:center;">KAZE Traders</p>
    <h1>Two-factor check</h1>
    <p style="margin-top:-0.55rem; margin-bottom:1.25rem; text-align:center; color:var(--text2);">Enter the 6-digit code from your authenticator app, or a backup code.</p>
    <form method="POST">
        <div class="form-group">
            <label>Authenticator code</label>
            <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="20" placeholder="123456" required autofocus>
        </div>
        <button type="submit">Continue</button>
    </form>
    <p style="text-align:center;margin-top:1rem;"><a href="{{ url_for('login') }}">Back to login</a></p>
</div>
{% endblock %}
