{% extends "base.html" %}
{% block title %}Notes{% endblock %}
{% block content %}
<div class="page-header"><h1><i data-lucide="sticky-note"></i> Notes</h1></div>
<div class="table-wrapper">
<table>
<thead><tr><th>Title</th><th>Created</th></tr></thead>
<tbody>
{% for n in notes %}
<tr><td>{{ n.title }}</td><td>{{ n.created_at }}</td></tr>
{% else %}
<tr><td colspan="2">No notes.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
