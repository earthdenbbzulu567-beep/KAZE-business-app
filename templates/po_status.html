{% extends "base.html" %}
{% block title %}Purchase Orders{% endblock %}
{% block content %}
<div class="page-header"><h1><i data-lucide="clipboard-list"></i> Purchase Orders</h1></div>
<div class="table-wrapper">
<table>
<thead><tr><th>ID</th><th>Status</th><th>Total</th><th>Date</th></tr></thead>
<tbody>
{% for o in orders %}
<tr><td>{{ o.id }}</td><td>{{ o.status }}</td><td>{{ money(o.total_amount) }}</td><td>{{ o.created_date }}</td></tr>
{% else %}
<tr><td colspan="4">No purchase orders.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
