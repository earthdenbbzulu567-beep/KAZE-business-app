{% extends "base.html" %}
{% block title %}Recent Activity{% endblock %}
{% block content %}
<div class="page-header"><h1><i data-lucide="activity"></i> Recent Activity</h1></div>
<div class="table-wrapper">
<table>
<thead><tr><th>When</th><th>Action</th><th>Details</th></tr></thead>
<tbody>
{% for a in activities %}
<tr><td>{{ a.created_at }}</td><td>{{ a.action }}</td><td>{{ a.details }}</td></tr>
{% else %}
<tr><td colspan="3">No activity yet.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
