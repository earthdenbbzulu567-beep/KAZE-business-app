{% extends "base.html" %}
{% block title %}Recurring Overview{% endblock %}
{% block content %}
<div class="page-header"><h1><i data-lucide="repeat"></i> Recurring Items</h1></div>
<div class="table-wrapper">
<table>
<thead><tr><th>Name</th><th>Amount</th><th>Next due</th><th>Type</th></tr></thead>
<tbody>
{% for i in items %}
<tr><td>{{ i.name }}</td><td>{{ money(i.amount) }}</td><td>{{ i.next_due }}</td><td>{{ i.type }}</td></tr>
{% else %}
<tr><td colspan="4">No recurring items.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
