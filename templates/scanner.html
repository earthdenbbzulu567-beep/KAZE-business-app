{% extends "base.html" %}
{% block title %}QR / Barcode Scanner{% endblock %}
{% block content %}
<div class="page-header">
  <h1><i data-lucide="scan"></i> QR / Barcode Scanner</h1>
  <p>Scan products for stock or sales (uses device camera)</p>
</div>
<div class="card">
  <video id="preview" style="width:100%; max-height:400px; background:#000;"></video>
  <button class="btn" onclick="startScan()">Start Camera Scan</button>
  <div id="result" class="mt-2"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
async function startScan() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  document.getElementById('preview').srcObject = stream;
  document.getElementById('preview').play();
  // Basic loop would go here; for demo
  alert('Camera access granted. Full barcode detection can be expanded with jsQR.');
}
</script>
{% endblock %}
