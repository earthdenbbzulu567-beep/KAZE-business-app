{% extends "base.html" %}
{% block title %}Financial Snapshot{% endblock %}
{% block content %}
<div class="page-header"><h1><i data-lucide="file-bar-chart"></i> Monthly Financial Snapshot</h1></div>
<div class="stats-grid">
  <div class="stat-card"><div class="stat-value">{{ money(sales) }}</div><div class="stat-label">Sales</div></div>
  <div class="stat-card"><div class="stat-value">{{ money(expenses) }}</div><div class="stat-label">Expenses</div></div>
  <div class="stat-card"><div class="stat-value">{{ money(profit) }}</div><div class="stat-label">Net Profit</div></div>
</div>
{% endblock %}
