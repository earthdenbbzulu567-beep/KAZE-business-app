{% extends "base.html" %}
{% block title %}Tasks Due{% endblock %}
{% block content %}
<div class="page-header"><h1><i data-lucide="check-square"></i> Tasks Due</h1></div>
<div class="table-wrapper">
<table>
<thead><tr><th>Title</th><th>Due</th><th>Status</th></tr></thead>
<tbody>
{% for t in tasks %}
<tr><td>{{ t.title }}</td><td>{{ t.due_date or '—' }}</td><td>{{ t.status }}</td></tr>
{% else %}
<tr><td colspan="3">No open tasks.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
