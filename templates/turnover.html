{% extends "base.html" %}
{% block title %}Inventory Turnover{% endblock %}
{% block content %}
<div class="page-header"><h1><i data-lucide="refresh-ccw"></i> Inventory Turnover</h1></div>
<div class="card">
  <table class="data-table">
    <thead><tr><th>Item</th><th>Quantity</th><th>Cost Value</th></tr></thead>
    <tbody>
      {% for i in items %}
      <tr><td>{{ i.name }}</td><td>{{ i.quantity }}</td><td>{{ money(i.quantity * i.cost) }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
