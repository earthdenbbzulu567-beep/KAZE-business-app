{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Practical guide</h1>
        <p>A working tour of KAZE — not a brochure. Follow the steps, then try the page.</p>
    </div>
    <a href="{{ url_for('guide_pdf') }}" class="btn-secondary" style="text-decoration:none;padding:10px 18px;">Download PDF guide</a>
</div>

<div class="guide-progress">
    <div class="guide-progress-bar"><span id="guideFill"></span></div>
    <p id="guideStatus">Step 1 of 18</p>
</div>

<div class="guide-layout">
    <nav class="guide-toc" id="guideToc" aria-label="Guide sections"></nav>
    <article class="guide-stage">
        <div class="guide-card" id="guideCard"></div>
        <div class="guide-nav">
            <button type="button" class="btn-secondary" id="guidePrev">Previous</button>
            <button type="button" id="guideNext">Next</button>
        </div>
        <p class="guide-hint">Tip: finish a step on the real page, then come back. Your data stays.</p>
    </article>
</div>

<style>
.guide-progress { margin: 0 0 1.4rem; }
.guide-progress-bar {
    height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden;
}
.guide-progress-bar span {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--red), var(--red-bright));
    transition: width 0.35s var(--ease-out);
}
#guideStatus { margin-top: 0.45rem; font-size: 0.85rem; color: var(--text3); }
.guide-layout {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    gap: 1.25rem;
}
.guide-toc {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0.6rem;
    max-height: 70vh;
    overflow: auto;
    position: sticky;
    top: 76px;
}
.guide-toc button {
    display: block; width: 100%; text-align: left;
    background: transparent; color: var(--text2);
    border: 0; border-radius: 8px; padding: 8px 10px;
    font-size: 0.82rem; cursor: pointer; font-family: inherit;
}
.guide-toc button:hover { background: var(--surface2); color: var(--text); }
.guide-toc button.is-on { background: var(--red-glow); color: var(--red-bright); font-weight: 700; }
.guide-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.4rem 1.5rem 1.5rem;
    min-height: 280px;
}
.guide-card h3 { font-size: 1.35rem; margin-bottom: 0.35rem; }
.guide-card .step-kicker {
    color: var(--red-bright); font-size: 0.75rem; letter-spacing: 0.12em;
    text-transform: uppercase; font-weight: 700; margin-bottom: 0.35rem;
}
.guide-card p { margin: 0.55rem 0; max-width: 640px; }
.guide-card ol { margin: 0.6rem 0 0.8rem 1.2rem; color: var(--text2); }
.guide-card li { margin: 0.25rem 0; }
.guide-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1rem; }
.guide-nav { display: flex; justify-content: space-between; margin-top: 1rem; }
.guide-hint { color: var(--text3); font-size: 0.82rem; margin-top: 0.8rem; }
@media (max-width: 800px) {
    .guide-layout { grid-template-columns: 1fr; }
    .guide-toc { position: static; max-height: 180px; }
}
</style>

<script>
const STEPS = {{ steps | tojson }};
let i = 0;
const card = document.getElementById('guideCard');
const toc = document.getElementById('guideToc');
const fill = document.getElementById('guideFill');
const status = document.getElementById('guideStatus');

function renderToc() {
    toc.innerHTML = STEPS.map((s, idx) =>
        `<button type="button" data-i="${idx}" class="${idx===i?'is-on':''}">${idx+1}. ${s.title}</button>`
    ).join('');
    toc.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        i = Number(b.dataset.i); show();
    }));
}
function show() {
    const s = STEPS[i];
    card.innerHTML = `
        <div class="step-kicker">Step ${i+1} · ${s.group}</div>
        <h3>${s.title}</h3>
        <p>${s.body}</p>
        <ol>${s.do_this.map(x => `<li>${x}</li>`).join('')}</ol>
        <div class="guide-actions">
            <a href="${s.href}"><button type="button">Open this page</button></a>
        </div>
    `;
    fill.style.width = ((i+1) / STEPS.length * 100) + '%';
    status.textContent = `Step ${i+1} of ${STEPS.length}`;
    document.getElementById('guidePrev').disabled = i === 0;
    document.getElementById('guideNext').textContent = i === STEPS.length-1 ? 'Finish' : 'Next';
    renderToc();
    try { localStorage.setItem('kaze-guide-step', String(i)); } catch (e) {}
}
document.getElementById('guidePrev').addEventListener('click', () => { if (i>0) { i--; show(); } });
document.getElementById('guideNext').addEventListener('click', () => {
    if (i < STEPS.length-1) { i++; show(); }
    else { window.location = "{{ url_for('dashboard') }}"; }
});
try { i = Math.min(STEPS.length-1, parseInt(localStorage.getItem('kaze-guide-step')||'0', 10) || 0); } catch(e) {}
show();
</script>
{% endblock %}
