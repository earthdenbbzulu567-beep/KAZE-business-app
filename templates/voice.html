{% extends "base.html" %}
{% block title %}Voice Entry{% endblock %}
{% block content %}
<div class="page-header">
  <h1><i data-lucide="mic"></i> Voice Entry</h1>
  <p>Speak to add sales or stock updates (browser speech recognition)</p>
</div>
<div class="card">
  <button class="btn" id="listenBtn">Start Listening</button>
  <div id="transcript" class="mt-2 p-2 border" style="min-height:80px;">Waiting for speech...</div>
  <p class="note">Say things like "Add sale of 5 rice for 50 kwacha" — expandable with parsing.</p>
</div>
<script>
const btn = document.getElementById('listenBtn');
const out = document.getElementById('transcript');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  const rec = new SpeechRecognition();
  rec.continuous = false;
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    out.textContent = text;
  };
  btn.onclick = () => rec.start();
} else {
  out.textContent = 'Speech recognition not supported in this browser.';
}
</script>
{% endblock %}
