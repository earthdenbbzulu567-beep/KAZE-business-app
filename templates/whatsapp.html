{% extends "base.html" %}
{% block title %}WhatsApp Hub{% endblock %}
{% block content %}
<div class="page-header">
  <h1><i data-lucide="message-circle"></i> WhatsApp Hub</h1>
  <p>Quickly share invoices and reminders via WhatsApp</p>
</div>
<div class="card">
  <table class="data-table">
    <thead><tr><th>Customer</th><th>Phone</th><th>Action</th></tr></thead>
    <tbody>
      {% for c in customers %}
      <tr>
        <td>{{ c.name }}</td>
        <td>{{ c.phone }}</td>
        <td><a class="btn-sm" href="https://wa.me/{{ c.phone | replace('+','') }}?text=Hello%20{{ c.name }},%20this%20is%20your%20invoice%20from%20KAZE." target="_blank">Send WhatsApp</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
